<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="AI Coding Rules: one source of truth for every AI coding agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- left: title -->
  <text x="72" y="118" class="mono" font-size="22" fill="#7dd3fc">$ npx ai-coding-rules init</text>
  <text x="72" y="196" class="sans" font-size="64" font-weight="800" fill="#f8fafc">AI Coding Rules</text>
  <rect x="72" y="218" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="270" class="sans" font-size="28" fill="#cbd5e1">One source of truth for every AI coding agent.</text>
  <text x="72" y="310" class="sans" font-size="22" fill="#94a3b8">Scan your repo · generate evidence-backed rules · lint them for</text>
  <text x="72" y="340" class="sans" font-size="22" fill="#94a3b8">conflicts, stale commands and duplicates. Offline. No API key.</text>

  <!-- right: source → targets -->
  <g class="mono" font-size="17" transform="translate(44 0)">
    <rect x="852" y="72" width="168" height="44" rx="10" fill="#1e293b" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="936" y="100" text-anchor="middle" fill="#e2e8f0">your repo</text>
    <path d="M936 116 V150" stroke="#475569" stroke-width="2"/>
    <rect x="828" y="150" width="216" height="44" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="936" y="178" text-anchor="middle" fill="#ede9fe">facts + evidence</text>
    <path d="M936 194 V214 M786 214 H1086 M786 214 V232 M936 214 V232 M1086 214 V232" stroke="#475569" stroke-width="2" fill="none"/>
    <g fill="#0f172a" stroke="#334155" stroke-width="1.5">
      <rect x="716" y="232" width="140" height="38" rx="9"/>
      <rect x="866" y="232" width="140" height="38" rx="9"/>
      <rect x="1016" y="232" width="140" height="38" rx="9"/>
      <rect x="752" y="282" width="208" height="38" rx="9"/>
      <rect x="970" y="282" width="140" height="38" rx="9"/>
    </g>
    <g fill="#e2e8f0" text-anchor="middle" font-size="15">
      <text x="786" y="256">AGENTS.md</text>
      <text x="936" y="256">CLAUDE.md</text>
      <text x="1086" y="256">.cursor/rules</text>
      <text x="856" y="306">copilot-instructions</text>
      <text x="1040" y="306">GEMINI.md</text>
    </g>
    <text x="936" y="358" text-anchor="middle" font-size="16" fill="#4ade80">✔ doctor: 0 conflicts · 0 stale · 0 duplicates</text>
  </g>
</svg>
